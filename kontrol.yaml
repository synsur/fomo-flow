contract: 1
name: profphet
display_name: "profphet"
path: /Users/cynful/fohomo
description: "profphet (@profphetic) on X: crypto and money twitter, receipts from public on-chain data. Posts in two lanes, one for one - data grounded in the live database, life shaped from the operator's own seeds (VOICE.md). fomo.family is the first data series; a live Telegram feed and referral funnel are planned (PLAN.md)."
timezone: America/Toronto
shapes: [feed, social]

commands:
  status: "uv run --no-project --python 3.12 python kontrol_adapter.py status"
  run:    "uv run --no-project --python 3.12 python kontrol_adapter.py run"
  queue:  "uv run --no-project --python 3.12 python kontrol_adapter.py queue"
  decide: "uv run --no-project --python 3.12 python kontrol_adapter.py decide"
  learn:  "uv run --no-project --python 3.12 python kontrol_adapter.py learn"

hosts:
  run: pc

jobs:                             # the Telegram feed poller (PLAN.md A1-A3) is declared here once it exists;
                                  # declaring an unbuilt job makes "never ran" meaningless (kontrol D-012)
  - id: ingest
    schedule: "0 6 * * *"
    command: "uv run --no-project --python 3.12 --with lz4 python fomo_ingest.py"   # lz4 decodes the daily .csv.lz4 files; the PC has no system lz4
    host: pc
    max_silence: 30h
    expected_runtime: 30m

accounts:
  - id: x
    platform: x
    handle: "@profphetic"
    posting: manual                 # kontrol drafts and checks; the operator posts. See research x-posting-method.
    replies: off
    interactions: off
    limits: { posts_per_day: 3 }
    disclosures: [referral]
  - id: telegram
    platform: telegram
    handle: "(channel pending)"
    posting: api
    replies: off
    interactions: off
    limits: { posts_per_day: 48 }
    disclosures: [referral]

gates:
  - id: confirm-intake
    lane: setup
    kind: decision
    delegable: false
    if_unanswered: wait
  - id: referral-terms
    lane: setup
    kind: manual-step
    delegable: false
    reason: "reading fomo.family's referral terms needs the operator's account"
    if_unanswered: wait
  - id: telegram-channel
    lane: setup
    kind: manual-step
    delegable: false
    reason: "creating the channel and bot needs the operator's Telegram account"
    if_unanswered: wait
  - id: reference-accounts
    lane: setup
    kind: decision
    delegable: false
    if_unanswered: wait
  - id: openrouter-key
    lane: setup
    kind: manual-step
    delegable: false
    reason: "the generator writes candidate posts through OpenRouter; without the key every option is a template"
    if_unanswered: wait
  - id: pick-post
    kind: decision
    delegable: true
    if_unanswered: wait
  - id: need-seeds
    lane: setup
    kind: manual-step
    delegable: false
    reason: "a life post is shaped from something that actually happened; only the operator has those"
    if_unanswered: wait
  - id: approve-post
    kind: approve-item
    delegable: true
    if_unanswered: wait
  - id: post
    kind: manual-step
    delegable: true
    if_unanswered: wait

cadence:
  target_per_week: 7
  buffer_min_days: 3

grounding: required

budget:
  monthly_usd: 10

secrets:
  TELEGRAM_BOT_TOKEN: telegram-channel
  REFERRAL_LINK: referral-terms
  OPENROUTER_API_KEY: openrouter-key

research:
  - id: x-posting-method
    question: "Post and read analytics on X: official API tier, browser automation, or manual? Shared decision with Debate Receipts."
    cadence: quarterly
    last_answered: null
  - id: fee-wallet-still-valid
    question: "Does the FOMO fee wallet still match the DefiLlama adapter, and does the referral programme still exist on the same terms?"
    cadence: monthly
    last_answered: 2026-09-07
